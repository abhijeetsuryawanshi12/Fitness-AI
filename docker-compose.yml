

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fitness-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    restart: unless-stopped
    volumes:
      - ./chroma_db:/app/chroma_db # Persist vector DB
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the backend URL to the build
        # Users can override this by creating a .env in the same dir as docker-compose or setting shell env
        - VITE_API_BASE_URL=http://localhost:8000 
    container_name: fitness-ai-frontend
    ports:
      - "5173:80"
    env_file:
      - frontend/.env
    restart: unless-stopped
    depends_on:
      - backend

# Define named volumes if needed, but we used host path binding for simplicity of local usage
